<!-- SMART TOOL BOX 파비콘 — 16px 가독성 우선(밝은 타일, 자 눈금 생략) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="tbf-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5aa8" />
      <stop offset="1" stop-color="#1e86e8" />
    </linearGradient>
    <linearGradient id="tbf-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4e8ff" />
      <stop offset="1" stop-color="#6cc2ff" />
    </linearGradient>
    <mask id="tbf-jaw" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect x="0" y="0" width="48" height="48" fill="#ffffff" transform="rotate(20 18 22)" />
      <rect x="16" y="2" width="4" height="7.6" rx="0.8" fill="#000000" />
    </mask>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#tbf-tile)" />
  <g transform="rotate(16 31 20)">
    <rect x="27.6" y="6.5" width="6.8" height="20" rx="1.6" fill="url(#tbf-sky)" />
  </g>
  <g transform="rotate(-20 18 22)" mask="url(#tbf-jaw)">
    <rect x="15.8" y="10" width="4.4" height="17" rx="2.2" fill="#ffffff" />
    <circle cx="18" cy="9" r="5.4" fill="#ffffff" />
  </g>
  <path d="M9.6 26h28.8l-1.7 9.9a3 3 0 0 1-3 2.5H14.3a3 3 0 0 1-3-2.5z" fill="#ffffff" />
  <rect x="8" y="23.2" width="32" height="4.4" rx="2.2" fill="#ffffff" />
  <rect x="20.2" y="30.4" width="7.6" height="2.8" rx="1.4" fill="url(#tbf-tile)" />
</svg>
