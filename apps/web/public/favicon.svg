<!-- SmartPlan 파비콘 — 16px 가독성 우선(솔리드 타일 + 흰 SP) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="sp-favicon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5aa8" />
      <stop offset="1" stop-color="#1e86e8" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#sp-favicon)" />
  <text
    x="24"
    y="25"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial Black, Segoe UI Black, Impact, sans-serif"
    font-weight="900"
    font-size="24"
    letter-spacing="-1.8"
    fill="#ffffff"
  >SP</text>
</svg>
