<!-- SMART TOOL BOX 앱 아이콘 — 열린 공구함 위로 렌치(흰색)·자(하늘색)가 솟는다. 시리즈 공통 네이비 타일 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <defs>
    <linearGradient id="tb-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00335f" />
      <stop offset="1" stop-color="#1478d6" />
    </linearGradient>
    <linearGradient id="tb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4e8ff" />
      <stop offset="1" stop-color="#6cc2ff" />
    </linearGradient>
    <mask id="tb-jaw" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect x="0" y="0" width="48" height="48" fill="#ffffff" transform="rotate(20 18 22)" />
      <rect x="16" y="2" width="4" height="7.6" rx="0.8" fill="#000000" />
    </mask>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#tb-tile)" />
  <!-- 자 — 공구함 오른쪽 뒤에서 비스듬히 솟는다(하늘색) -->
  <g transform="rotate(16 31 20)">
    <rect x="27.6" y="6.5" width="6.8" height="20" rx="1.6" fill="url(#tb-sky)" />
    <path d="M27.6 10.5h3M27.6 13.8h2M27.6 17.1h3M27.6 20.4h2" stroke="#0b4d97" stroke-opacity="0.7" stroke-width="1.2" stroke-linecap="round" />
  </g>
  <!-- 렌치 — 왼쪽 뒤에서 반대로 기운다(흰색). 입 벌린 머리는 마스크로 판다 -->
  <g transform="rotate(-20 18 22)" mask="url(#tb-jaw)">
    <rect x="15.8" y="10" width="4.4" height="17" rx="2.2" fill="#ffffff" />
    <circle cx="18" cy="9" r="5.4" fill="#ffffff" />
  </g>
  <!-- 공구함 — 테두리 띠 + 아래로 좁아지는 몸통, 가운데 잠금 홈 -->
  <path d="M9.6 26h28.8l-1.7 9.9a3 3 0 0 1-3 2.5H14.3a3 3 0 0 1-3-2.5z" fill="#ffffff" />
  <rect x="8" y="23.2" width="32" height="4.4" rx="2.2" fill="#ffffff" />
  <rect x="20.2" y="30.4" width="7.6" height="2.8" rx="1.4" fill="url(#tb-tile)" />
</svg>
