<!-- SmartDeck 앱 아이콘 — 큰 자리용(겹침: S 위에 D를 하늘색으로 겹쳐 깊이) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <defs>
    <linearGradient id="sd-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00335f" />
      <stop offset="1" stop-color="#1478d6" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#sd-icon)" />
  <text
    x="18"
    y="25"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial Black, Segoe UI Black, Impact, sans-serif"
    font-weight="900"
    font-size="25"
    fill="#ffffff"
    fill-opacity="0.92"
  >S</text>
  <!-- D 는 기둥이 두꺼워 그냥 겹치면 뭉친다 → 배경과 같은 그라디언트로 둘레를 그어 틈을 만든다 -->
  <text
    x="31"
    y="25"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial Black, Segoe UI Black, Impact, sans-serif"
    font-weight="900"
    font-size="25"
    fill="#8fd4ff"
    fill-opacity="0.72"
    stroke="url(#sd-icon)"
    stroke-width="2.6"
    stroke-linejoin="round"
    paint-order="stroke"
  >D</text>
</svg>
