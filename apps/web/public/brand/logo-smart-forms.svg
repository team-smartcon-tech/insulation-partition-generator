<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="스마트폼 — Site Document &amp; QMP Management">
  <title>스마트폼(Smart Forms)</title>
  <!--
    카드 썸네일 규격: 16:10 (1600x1000) 흰 바탕에 로고를 가운데 두고 여백을 준다(TC/HOIST·단열 Layout 과 같은 규격).
    마크: 서식 한 장 위에 신호등(완료·작성 중·미작성) 줄 — 품질관리계획서 서류를 쓰고 진척을 보는 도구.
  -->
  <defs>
    <linearGradient id="sf-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F79236"/><stop offset="1" stop-color="#EC6A16"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <!-- 마크·글자 묶음(대략 x40..640, y34..232)을 가로 65% 크기로 가운데 -->
  <g transform="translate(211.6 268.6) scale(1.74)">

    <!-- 청사진 바탕 (아주 옅게) -->
    <g stroke="#004791" opacity="0.09" stroke-width="1" fill="none">
      <path d="M60 36V182M100 36V182M140 36V182M180 36V182M220 36V182"/>
      <path d="M40 52H244M40 92H244M40 132H244M40 172H244"/>
    </g>

    <!-- 서식 한 장 (오른쪽 위 접힌 귀) -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 44h104l34 34v142a10 10 0 0 1-10 10H64a10 10 0 0 1-10-10V54a10 10 0 0 1 10-10z" fill="#FFFFFF" stroke="#004791" stroke-width="7"/>
      <path d="M168 44v24a10 10 0 0 0 10 10h24" fill="none" stroke="#004791" stroke-width="7"/>

      <!-- 머리글 띠 -->
      <rect x="72" y="62" width="80" height="12" rx="6" fill="#004791"/>

      <!-- 신호등 줄: 완료(초록) · 작성 중(주황) · 미작성(빈 동그라미) -->
      <circle cx="82" cy="104" r="9" fill="#16A34A"/>
      <rect x="100" y="99" width="84" height="10" rx="5" fill="#004791" opacity="0.28"/>
      <circle cx="82" cy="138" r="9" fill="url(#sf-warm)"/>
      <rect x="100" y="133" width="66" height="10" rx="5" fill="#004791" opacity="0.28"/>
      <circle cx="82" cy="172" r="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="4"/>
      <rect x="100" y="167" width="76" height="10" rx="5" fill="#004791" opacity="0.18"/>
    </g>

    <!-- 확인 배지 -->
    <circle cx="210" cy="206" r="28" fill="url(#sf-warm)"/>
    <path d="M197 206l9 9 17-19" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 이름 -->
    <g font-family="'SUIT Variable','SUIT','Pretendard Variable','Pretendard',-apple-system,'Segoe UI',sans-serif">
      <text x="292" y="114" font-size="64" font-weight="800" fill="#0F2A4A" letter-spacing="-1.5">스마트폼</text>
      <text x="294" y="168" font-size="40" font-weight="500" fill="#0F2A4A" letter-spacing="-0.5">Smart Forms</text>
      <rect x="296" y="188" width="80" height="4" rx="2" fill="url(#sf-warm)"/>
      <text x="296" y="222" font-size="17" font-weight="500" fill="#5C6E82" letter-spacing="2">Site Document &amp; QMP Management</text>
    </g>
  </g>
</svg>
