<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="동절기 열원검토 — Cold Weather Concrete Heating Review">
  <title>동절기 열원검토</title>
  <!-- 카드 썸네일 규격: 16:10 (1600x1000) 흰 바탕에 로고를 가운데 두고 여백을 준다 (logo-tc-rental.svg 와 같은 규격) -->
  <defs>
    <linearGradient id="hr-warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#EC6A16"/><stop offset="1" stop-color="#F9A23B"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <g transform="translate(211.6 268.6) scale(1.74)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 청사진 바탕 (아주 옅게) -->
      <g stroke="#004791" opacity="0.09" stroke-width="1">
        <path d="M60 36V232M100 36V232M140 36V232M180 36V232M220 36V232"/>
        <path d="M40 52H244M40 92H244M40 132H244M40 172H244M40 212H244"/>
      </g>
      <!-- 보양 천막(상옥) + 양생실 -->
      <path d="M60 204V112l82-62 82 62v92" stroke="#004791" stroke-width="5"/>
      <path d="M60 146h164" stroke="#004791" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>
      <path d="M44 204h196" stroke="#004791" stroke-width="5"/>
