<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="단열 MAKER — Insulation Layout &amp; Takeoff">
  <title>단열 MAKER</title>
  <!--
    홈 카드 썸네일 원본 (16:9, 카드 패널 배경 #f7f9fc 와 같은 바탕이라 흰 상자가 떠 보이지 않는다).
    <img> 로 그린 SVG 는 웹폰트(SUIT)를 못 읽으므로 화면에는 이 파일을 렌더한 thumbs/insulation-maker.png 를 쓴다.
    짝: logo-tile-maker.svg — 마크 크기·글자 위치를 같게 맞춘다.
  -->
  <defs>
    <linearGradient id="im-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B5BB0"/><stop offset="1" stop-color="#003A78"/>
    </linearGradient>
    <linearGradient id="im-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA24A"/><stop offset="1" stop-color="#EC6A16"/>
    </linearGradient>
    <clipPath id="im-wall"><rect x="54" y="62" width="192" height="176" rx="10"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <!-- 마크+워드마크 실측 폭(x236~1377)을 화면 가운데로 두고 카드에서 읽히게 1.15배 -->
  <g transform="translate(800 450) scale(1.15) translate(-806 -450)">

  <!-- ── 마크: 전개된 외벽 위에 엇갈려 나눈 단열 보드 + 피해 잘린 창호 ── -->
  <g transform="translate(236 300)">
    <rect x="0" y="12" width="300" height="300" rx="72" fill="#003A78" opacity="0.12"/>
    <rect width="300" height="300" rx="72" fill="url(#im-navy)"/>
    <g clip-path="url(#im-wall)">
      <rect x="86" y="106" width="64" height="44" fill="url(#im-warm)"/>
      <rect x="118" y="150" width="64" height="44" fill="#FFC48F"/>
      <g stroke="#FFFFFF" stroke-width="5" opacity="0.92" fill="none">
        <path d="M54 106H246M54 150H246M54 194H246"/>
        <path d="M118 62v44M182 62v44"/>
        <path d="M86 106v44M150 106v44M214 106v44"/>
        <path d="M118 150v44M182 150v44"/>
        <path d="M86 194v44M150 194v44M214 194v44"/>
      </g>
    </g>
    <rect x="54" y="62" width="192" height="176" rx="10" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <!-- 오프닝(창호) — 보드가 이걸 피해 잘린다 -->
    <rect x="170" y="128" width="54" height="58" rx="5" fill="#0A4C93" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M197 128v58" stroke="#FFFFFF" stroke-width="3.5"/>
  </g>

  <!-- ── 워드마크 ── -->
  <g font-family="'SUIT Variable','SUIT','Pretendard Variable','Pretendard','Malgun Gothic',sans-serif">
    <text x="610" y="468" font-size="138" font-weight="800" fill="#0F2A4A" letter-spacing="-3">단열<tspan dx="26" font-weight="300" fill="#004791" letter-spacing="6">MAKER</tspan></text>
    <rect x="614" y="512" width="96" height="8" rx="4" fill="url(#im-warm)"/>
    <text x="614" y="580" font-size="30" font-weight="600" fill="#6B7C90" letter-spacing="7">INSULATION LAYOUT · TAKEOFF</text>
  </g>
  </g>
</svg>
