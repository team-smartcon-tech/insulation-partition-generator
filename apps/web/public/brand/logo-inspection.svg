<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="검측 Request — 검측요청">
  <title>검측 Request</title>
  <!--
    홈 카드 썸네일 (16:9, 카드 패널 배경 #f7f9fc). logo-gantt.svg · logo-tile-maker.svg 와 같은
    배지 마크 + 큰 워드마크 배치. 워드마크는 「검측(굵게) Request(가늘게)」 — Smart Gantt 와 같은 굵기·간격.
  -->
  <defs>
    <linearGradient id="ir-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B5BB0"/><stop offset="1" stop-color="#003A78"/>
    </linearGradient>
    <linearGradient id="ir-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA24A"/><stop offset="1" stop-color="#EC6A16"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <g transform="translate(800 450) scale(1.15) translate(-836 -450)">

  <!-- ── 마크: 둥근 배지 안 클립보드(검측 체크리스트) + 주황 체크 ── -->
  <g transform="translate(236 300)">
    <rect x="0" y="12" width="300" height="300" rx="72" fill="#003A78" opacity="0.12"/>
    <rect width="300" height="300" rx="72" fill="url(#ir-navy)"/>
    <rect x="78" y="58" width="144" height="196" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="114" y="42" width="72" height="34" rx="10" fill="#9FD0FF"/>
    <path d="M102 112H198M102 146H176" stroke="#003A78" stroke-width="10" stroke-linecap="round" opacity="0.25" fill="none"/>
    <path d="M110 196l26 26l52 -56" stroke="url(#ir-warm)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ── 워드마크 ── -->
  <g font-family="'SUIT Variable','SUIT','Pretendard Variable','Pretendard','Malgun Gothic',sans-serif">
    <text x="610" y="468" font-size="138" font-weight="800" fill="#0F2A4A" letter-spacing="-3">검측<tspan dx="26" font-weight="300" fill="#004791" letter-spacing="4">Request</tspan></text>
    <rect x="614" y="512" width="96" height="8" rx="4" fill="url(#ir-warm)"/>
    <text x="614" y="580" font-size="30" font-weight="600" fill="#6B7C90" letter-spacing="2">검측요청 · 전자서명 · 결과통보</text>
  </g>
  </g>
</svg>
