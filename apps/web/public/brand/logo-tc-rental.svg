<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="TC/HOIST 발주의뢰서 — Tower Crane &amp; Hoist Purchase Order">
  <title>TC/HOIST 발주의뢰서</title>
  <!--
    카드 썸네일 규격: 16:10 (1600x1000) 흰 바탕에 로고를 가운데 두고 여백을 준다.
    단열 Layout 의 thumbs/insulation-logo.png 와 같은 규격이라 홈에서 두 카드가 같은 크기로 보인다.
    로고를 여백 없이 꽉 채우면 object-contain 이 가로만 맞춰 글자가 카드 끝에 붙는다.
  -->
  <defs>
    <linearGradient id="tc-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F79236"/><stop offset="1" stop-color="#EC6A16"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <!-- 실측 bbox(x40 y34 w596 h198)를 가로 65% 크기로 중앙에 앉힌다 -->
  <g transform="translate(211.6 268.6) scale(1.74)">

    <!-- ── 마크: 타워크레인이 '임대기간(간트 막대)' 위에 서 있다 ── -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">

      <!-- 청사진 바탕 (아주 옅게) -->
      <g stroke="#004791" opacity="0.09" stroke-width="1">
        <path d="M60 36V182M100 36V182M140 36V182M180 36V182M220 36V182"/>
        <path d="M40 52H244M40 92H244M40 132H244M40 172H244"/>
      </g>

      <g stroke="#004791">
        <!-- 지브(앞) · 카운터지브(뒤) -->
        <path d="M176 64H252M146 64H104" stroke-width="4"/>
        <!-- 타워 헤드에서 내린 인장 타이 -->
        <path d="M161 34 244 62M161 34 112 62" stroke-width="2.5" opacity="0.75"/>
        <path d="M161 34V52" stroke-width="2.5"/>
        <!-- 지브 래티스 -->
        <g stroke-width="1.8" opacity="0.55">
          <path d="M176 64l16-9 16 9 16-9 16 9M146 64l-14-9-14 9"/>
        </g>
        <!-- 운전실 -->
        <rect x="145" y="52" width="32" height="14" rx="3" stroke-width="3.5" fill="#FFFFFF"/>
        <!-- 마스트 (래티스) -->
        <path d="M150 66v112M172 66v112" stroke-width="4"/>
        <g stroke-width="1.8" opacity="0.55">
          <path d="M150 88h22M150 110h22M150 132h22M150 154h22"/>
          <path d="M150 66l22 22-22 22 22 22-22 22 22 22"/>
        </g>
        <!-- 권상 로프 + 후크 블록 -->
        <path d="M228 66v42" stroke-width="2.5"/>
        <rect x="220" y="108" width="16" height="12" rx="2.5" stroke-width="3" fill="#FFFFFF"/>
      </g>

      <!-- 카운터웨이트 -->
      <rect x="96" y="56" width="18" height="18" rx="2.5" fill="#004791"/>

      <!-- ── 임대기간: 간트 막대 3줄. 가운데(가동 구간)만 강조색 ── -->
      <g>
        <rect x="40" y="188" width="82" height="9" rx="4.5" fill="#004791" opacity="0.28"/>
        <rect x="62" y="204" width="150" height="9" rx="4.5" fill="url(#tc-warm)"/>
        <rect x="128" y="220" width="116" height="9" rx="4.5" fill="#004791" opacity="0.28"/>
      </g>
      <!-- 기초 -->
      <path d="M132 178h58" stroke="#004791" stroke-width="5"/>
    </g>

    <!-- ── 워드마크 ── -->
    <g font-family="'SUIT Variable','SUIT','Pretendard Variable','Pretendard',-apple-system,'Segoe UI',sans-serif">
      <text x="292" y="106" font-size="62" font-weight="800" fill="#0F2A4A" letter-spacing="-1">TC/HOIST</text>
      <text x="292" y="176" font-size="60" font-weight="500" fill="#0F2A4A" letter-spacing="-1.5">발주의뢰서</text>
      <rect x="294" y="196" width="80" height="4" rx="2" fill="url(#tc-warm)"/>
      <text x="294" y="228" font-size="17" font-weight="500" fill="#5C6E82" letter-spacing="2">Tower Crane &amp; Hoist Purchase Order</text>
    </g>
  </g>
</svg>
