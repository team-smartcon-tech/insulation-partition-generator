# 실명 사전 — 코드에 하드코딩하지 않는다.
#
# 카테고리
#   LIVING  : 도배·바닥 마감 대상 (거실·침실·안방·드레스룸 등)
#   WET     : 타일. 도배 제외 (욕실·화장실)
#   ENTRY   : 현관. 복도와 반드시 분리
#   SERVICE : 서비스면적. 전용면적 합계 제외, 마감 별도 (발코니·다용도·세탁·대피)
#   EXCLUDE : 시드로 쓰지 않는다 (코어부)
#
# 매칭은 "포함" 기준이며 위에서 아래로 먼저 걸린 카테고리를 쓴다.
# EXCLUDE 를 가장 먼저 두어 'ELEV.전실' 같은 코어부가 LIVING 으로 새지 않게 한다.

categories:
  EXCLUDE:
    - ELEV
    - E/V
    - 계단
    - 계단실
    - EPS
    - TPS
    - PD
    - AV
    - AV/PD
    - UP
    - DN
    - 전실
    - 홀
    - PIT
    - 샤프트

  WET:
    - 욕실
    - 화장실
    - 샤워실

  ENTRY:
    - 현관

  SERVICE:
    - 발코니
    - 발코니-1
    - 발코니-2
    - 다용도
    - 다용도실
    - 세탁
    - 세탁실
    - 대피공간
    - 실외기실

  LIVING:
    - 거실
    - 안방
    - 침실
    - 침실1
    - 침실2
    - 침실3
    - 주방
    - 식당
    - 주방/식당
    - 드레스룸
    - 드레스
    - 알파룸
    - 알파
    - 팬트리
    - 서재
    - 복도
    - 창고

# 시드로 쓰지 않을 텍스트 패턴 (정규식). 치수·타입명·마감표기 제외용.
seed_exclude_patterns:
  - '^\d+(\.\d+)?$'           # 순수 숫자 (치수)
  - '^\d{2,3}[A-Z]$'          # 타입명 84A
  - '^\d{2,3}[A-Z]\s*TYPE$'   # 84A TYPE
  - '^[A-Z]{1,3}$'            # 기호 약어
  - '^\(.*\)$'                # (하향식피난구) 같은 부기

# 개방형 LDK 통합 대상 — 이 실들이 벽 없이 연결되면 한 실로 합친다.
# 사용자 선택: "하나의 실 LDK 로 통합" (2026-07-30)
ldk:
  mode: merge          # merge | split | both
  merge_name: LDK
  members:
    - 거실
    - 주방
    - 식당
    - 주방/식당
